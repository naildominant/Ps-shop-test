# Публикует готовый пост (картинка + текст) из designer/posts/<папка> в Telegram.
# Запуск вручную: GitHub → Actions → publish-post → Run workflow.
# «превью мне в личку» — пост приходит владельцу с кнопками «✅ Опубликовать / ❌ Отмена»
# (кнопки обрабатывает Cloudflare Worker, см. worker/worker.js, раздел 4).
# «подключить кнопки» — один раз: передать токен бота серверу и включить webhook.
name: publish-post

on:
  workflow_dispatch:
    inputs:
      post:
        description: 'Папка поста в designer/posts (например 2026-11-17-sait)'
        required: false
        default: ''
      action:
        description: 'Что сделать'
        type: choice
        default: 'превью мне в личку'
        options:
          - 'превью мне в личку'
          - 'опубликовать в канал'
          - 'подключить кнопки'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
      TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL || '@psshopgo' }}
      WORKER_URL: ${{ vars.WORKER_URL || 'https://psshop.psshop.workers.dev' }}
      POST: ${{ inputs.post }}
      ACTION: ${{ inputs.action }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Отправить
        run: |
          case "$ACTION" in
            'подключить кнопки')
              # передаём токен бота серверу Cloudflare; сервер сам проверит его у Telegram (getMe)
              python3 -c 'import json,os;print(json.dumps({"token":os.environ["TELEGRAM_BOT_TOKEN"]}))' > /tmp/t.json
              curl -sS --fail-with-body -X POST "$WORKER_URL/tgpost/register" -H 'Content-Type: application/json' --data @/tmp/t.json; echo
              rm -f /tmp/t.json ;;
            'опубликовать в канал')  python3 designer/scripts/publish.py "designer/posts/$POST" --to channel ;;
            *)                       python3 designer/scripts/publish.py "designer/posts/$POST" --to test ;;
          esac
