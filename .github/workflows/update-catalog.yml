# Обновляет каталог из Telegram-канала и публикует сайт.
# Запускается:
#   - каждые 10 минут сервером Cloudflare (worker/worker.js вызывает workflow_dispatch);
#   - раз в час по расписанию GitHub (запасной вариант);
#   - при любом изменении кода в ветке main.
name: update-catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install pillow==11.0.0

      - name: Update catalog from the channel
        if: github.event_name != 'push'
        run: python3 scripts/catalog.py

      - name: Save catalog changes
        if: github.event_name != 'push'
        run: |
          git config user.name "psshop-bot"
          git config user.email "psshop-bot@users.noreply.github.com"
          git add data src/static/covers
          if git diff --cached --quiet; then
            echo "Каталог не изменился"
          else
            git commit -m "Каталог обновлён из канала"
            git push
          fi

      - name: Build site
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://psshop.uz' }}
          ORDER_API: ${{ vars.ORDER_API }}
          HITS_URL: ${{ vars.HITS_URL }}
          METRIKA_ID: ${{ vars.METRIKA_ID }}
        run: python3 scripts/build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
