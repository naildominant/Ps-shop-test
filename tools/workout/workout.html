<title>Моя тренировка</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: одна колонка как лист в спортзале — блоки упражнений, у каждого подхода своя большая кнопка; сверху липкая полоса прогресса, снизу таймер отдыха. */
:root {
  --bg: #EEF1F6;
  --card: #FFFFFF;
  --ink: #141A26;
  --muted: #5B6478;
  --line: #D6DCE7;
  --accent: #2F5BFF;
  --accent-ink: #FFFFFF;
  --done: #1E9E6A;
  --done-bg: #E1F5EC;
  --warn: #C2410C;
  --display: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
  --body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E121B; --card: #171D2A; --ink: #EEF1F7; --muted: #9AA3B8; --line: #29314A;
  --accent: #6E8BFF; --accent-ink: #0E121B; --done: #4CD69A; --done-bg: #143326; --warn: #FB923C; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E121B; --card: #171D2A; --ink: #EEF1F7; --muted: #9AA3B8; --line: #29314A;
  --accent: #6E8BFF; --accent-ink: #0E121B; --done: #4CD69A; --done-bg: #143326; --warn: #FB923C; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--body); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 120px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 620px; margin: 0 auto; display: grid; gap: 18px; }
h1, h2 { font-family: var(--display); margin: 0; letter-spacing: .01em; text-wrap: balance; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 10px; display: grid; gap: 8px; }
.bar-row { display: flex; align-items: baseline; gap: 4px 10px; flex-wrap: wrap; min-width: 0; }
.bar h1 { font-size: clamp(24px, 7vw, 30px); font-weight: 800; text-transform: uppercase; }
.bar .date { color: var(--muted); font-size: 13px; }
.bar .count { white-space: nowrap; margin-left: auto; font: 700 22px/1 var(--display); font-variant-numeric: tabular-nums; }
.track { height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; }
.fill { height: 100%; width: 0; background: var(--accent); border-radius: 999px; transition: width .25s; }
.fill.full { background: var(--done); }

.block { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 12px; }
.block-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.block h2 { font-size: 24px; font-weight: 700; text-transform: uppercase; }
.block .note { color: var(--muted); font-size: 13px; }
.ex { display: grid; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.ex:first-of-type { border-top: 0; padding-top: 0; }
.ex-name { font-weight: 600; font-size: 16px; }
.ex-name small { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 6px; }
.sets { display: flex; gap: 8px; flex-wrap: wrap; }
.set { min-width: 76px; min-height: 56px; padding: 6px 12px; border-radius: 14px; border: 2px solid var(--line); background: transparent; cursor: pointer; display: grid; place-items: center; gap: 0; line-height: 1.1; }
.set b { font: 700 22px/1 var(--display); font-variant-numeric: tabular-nums; }
.set span { font-size: 11px; color: var(--muted); }
.set[aria-pressed="true"] { border-color: var(--done); background: var(--done-bg); }
.set[aria-pressed="true"] b::after { content: " ✓"; color: var(--done); }
.round-label { font: 700 15px/1 var(--display); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.max { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.max label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.max input { min-height: 48px; border: 2px solid var(--line); border-radius: 12px; background: var(--bg); padding: 0 12px; font: 700 20px/1 var(--display); color: var(--ink); width: 100%; }
.best { font-size: 13px; color: var(--muted); }
.best b { color: var(--ink); }

.finish { background: var(--done-bg); border: 2px solid var(--done); border-radius: 18px; padding: 16px; display: grid; gap: 6px; }
.finish h2 { font-size: 26px; color: var(--done); text-transform: uppercase; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { min-height: 52px; padding: 0 20px; border-radius: 14px; border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 600; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.danger { border-color: var(--warn); background: var(--warn); color: var(--accent-ink); }

.hist { display: grid; gap: 0; }
.hist-row { display: grid; grid-template-columns: 92px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
.hist-row:first-child { border-top: 0; }
.hist-row .d { font-variant-numeric: tabular-nums; color: var(--muted); }
.hist-row .r { font: 700 18px/1 var(--display); font-variant-numeric: tabular-nums; text-align: right; }
.pill { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--done-bg); color: var(--done); margin-left: 6px; }
.pill.miss { background: transparent; color: var(--warn); border: 1px solid var(--warn); }
.empty { color: var(--muted); font-size: 14px; }
.status { color: var(--muted); font-size: 12px; }

.timer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--card); border-top: 1px solid var(--line); padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.timer-in { max-width: 620px; margin: 0 auto; display: flex; align-items: center; gap: 8px; }
.timer .lbl { font-size: 12px; line-height: 1.3; color: var(--muted); margin-right: auto; flex: 1; min-width: 0; }
.timer .tbox { display: grid; margin-right: auto; }
.timer .t-why { font-size: 12px; color: var(--muted); }
.timer.run { border-top: 3px solid var(--accent); }
.timer .clock { font: 800 44px/1 var(--display); font-variant-numeric: tabular-nums; margin-right: auto; }
.timer .clock.go { color: var(--done); }
.timer .btn { min-height: 46px; padding: 0 16px; }
@media (prefers-reduced-motion: reduce) { .fill { transition: none; } }
</style>

<div class="wrap">
  <header class="bar">
    <div class="bar-row"><h1>Тренировка</h1><span class="date" id="date"></span><span class="count" id="count">0 / 0</span></div>
    <div class="track"><div class="fill" id="fill"></div></div>
  </header>

  <section class="finish" id="finish" hidden>
    <h2>Тренировка завершена</h2>
    <p id="finish-text">Все подходы сделаны. Тренировка сохранена в истории.</p>
  </section>

  <div id="plan"></div>

  <section class="block">
    <div class="actions">
      <button class="btn" id="new">Новая тренировка</button>
    </div>
    <p class="status" id="new-note">Текущая тренировка сохранится в историю, отметки сбросятся.</p>
  </section>

  <section class="block">
    <div class="block-head"><h2>История</h2><span class="note" id="best-all"></span></div>
    <div class="hist" id="hist"><p class="empty">Загружаю историю…</p></div>
    <p class="status" id="store"></p>
  </section>
</div>

<div class="timer">
  <div class="timer-in">
    <span class="lbl" id="t-lbl">Отдых начнётся сам после отметки подхода</span>
    <span class="tbox" id="t-box" hidden><span class="t-why" id="t-why">Отдых</span><span class="clock" id="t-clock">0:00</span></span>
    <button class="btn ghost" id="t2" aria-label="Отдых 2 минуты">2:00</button>
    <button class="btn ghost" id="t5" aria-label="Отдых 5 минут">5:00</button>
    <button class="btn danger" id="tstop" hidden>Пропустить</button>
  </div>
</div>

<script>
// План одной тренировки. id подхода = блок.упражнение.подход
const PLAN = [
  { id: 'w', title: 'Разминка', note: '2 подхода', ex: [
    { id: 'push', name: 'Отжимания', sets: [20, 20] },
    { id: 'dips', name: 'Брусья', sets: [20, 20] },
    { id: 'archer', name: 'Отжимания лучником', sets: [20, 20] },
    { id: 'hand', name: 'Стойка на руках', sets: ['10 с', '10 с'] },
  ] },
  { id: 'd', title: 'Гантели', note: 'круговая, 2 круга, по 20 подряд', rounds: 2, ex: [
    { id: 'ham', name: 'Молоточки' },
    { id: 'back', name: 'Подъём за спиной' },
    { id: 'front', name: 'Подъём перед собой', hint: 'плечи' },
    { id: 'one', name: 'Подъём одной гантели на бицепс' },
  ] },
  { id: 'b', title: 'Штанга', note: 'жим лёжа', ex: [
    { id: 'bench', name: 'Жим лёжа', sets: [20, 20, 'макс'] },
  ] },
];
const ALL = [];
PLAN.forEach((b) => b.ex.forEach((e) => {
  if (b.rounds) for (let r = 1; r <= b.rounds; r++) ALL.push(`${b.id}.${e.id}.${r}`);
  else e.sets.forEach((_, i) => ALL.push(`${b.id}.${e.id}.${i + 1}`));
}));

const $ = (s) => document.querySelector(s);
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const fmtDate = (iso) => { const [y, m, d] = iso.split('-'); return `${d}.${m}.${y}`; };
let st = { date: today(), done: {}, maxReps: '', weight: '', saved: false };
let history = [];
let db = null, uid = null;

// ---------- хранение: сначала db (надёжно, только для владельца), запасной вариант — память браузера ----------
const LS = 'workout.v1';
const lsGet = () => { try { return JSON.parse(localStorage.getItem(LS) || 'null'); } catch { return null; } };
const lsSet = (v) => { try { localStorage.setItem(LS, JSON.stringify(v)); } catch { /* */ } };
const curDoc = () => db.doc(`data/users/${uid}/state/current`);
const histCol = () => db.collection(`data/users/${uid}/workouts`);
let saveTimer = null;
function persist() {
  lsSet({ st, history });
  if (!db) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { curDoc().set({ ...st, done: { ...st.done } }).catch(() => {}); }, 400);
}

// ---------- отрисовка ----------
function setBtn(key, top, sub) {
  return `<button class="set" data-k="${key}" aria-pressed="${!!st.done[key]}"><b>${top}</b>${sub ? `<span>${sub}</span>` : ''}</button>`;
}
function render() {
  $('#date').textContent = fmtDate(st.date);
  $('#plan').innerHTML = PLAN.map((b) => `<section class="block"><div class="block-head"><h2>${b.title}</h2><span class="note">${b.note}</span></div>
    ${b.ex.map((e) => `<div class="ex"><div class="ex-name">${e.name}${e.hint ? `<small>${e.hint}</small>` : ''}</div>
      <div class="sets">${b.rounds
        ? Array.from({ length: b.rounds }, (_, r) => setBtn(`${b.id}.${e.id}.${r + 1}`, '20', `круг ${r + 1}`)).join('')
        : e.sets.map((v, i) => setBtn(`${b.id}.${e.id}.${i + 1}`, v, `подход ${i + 1}`)).join('')}</div>
      ${e.id === 'bench' ? `<div class="max">
        <label for="reps">Повторов на максимум<input id="reps" inputmode="numeric" pattern="[0-9]*" placeholder="—" value="${st.maxReps}"></label>
        <label for="kg">Вес штанги, кг<input id="kg" inputmode="decimal" placeholder="—" value="${st.weight}"></label>
      </div><p class="best" id="best"></p>` : ''}</div>`).join('')}</section>`).join('');
  progress(); renderBest();
}
function progress() {
  const n = ALL.filter((k) => st.done[k]).length;
  $('#count').textContent = `${n} / ${ALL.length}`;
  $('#fill').style.width = `${(n / ALL.length) * 100}%`;
  $('#fill').classList.toggle('full', n === ALL.length);
  const fin = n === ALL.length;
  $('#finish').hidden = !fin;
  if (fin && !st.saved) saveToHistory();
}
function bestOf() { return history.reduce((b, h) => (Number(h.maxReps) > (b ? Number(b.maxReps) : 0) ? h : b), null); }
function renderBest() {
  const b = bestOf(); const last = history[0];
  const txt = [last && last.maxReps ? `В прошлый раз: <b>${last.maxReps}</b>${last.weight ? ` × ${last.weight} кг` : ''}` : '', b && b.maxReps ? `Рекорд: <b>${b.maxReps}</b>${b.weight ? ` × ${b.weight} кг` : ''}` : ''].filter(Boolean).join(' · ');
  const el = $('#best'); if (el) el.innerHTML = txt || 'Здесь появится прошлый результат и рекорд.';
  $('#best-all').textContent = b && b.maxReps ? `рекорд жима на максимум: ${b.maxReps}${b.weight ? ` × ${b.weight} кг` : ''}` : '';
}
function renderHistory() {
  const box = $('#hist');
  if (!history.length) { box.innerHTML = '<p class="empty">Пока пусто. Отметьте подходы — после «Новая тренировка» или когда всё сделано, день попадёт сюда.</p>'; renderBest(); return; }
  box.innerHTML = history.slice(0, 20).map((h) => {
    const miss = h.total - h.doneCount;
    return `<div class="hist-row"><span class="d">${fmtDate(h.date)}</span>
      <span>${h.doneCount} из ${h.total}${miss ? `<span class="pill miss">пропущено ${miss}</span>` : '<span class="pill">всё</span>'}</span>
      <span class="r">${h.maxReps ? `${h.maxReps}${h.weight ? `<small> × ${h.weight}</small>` : ''}` : '—'}</span></div>`;
  }).join('');
  renderBest();
}

// ---------- история ----------
async function saveToHistory() {
  const doneCount = ALL.filter((k) => st.done[k]).length;
  if (!doneCount) return;
  const rec = { date: st.date, doneCount, total: ALL.length, missed: ALL.filter((k) => !st.done[k]), maxReps: st.maxReps ? Number(st.maxReps) : null, weight: st.weight || null, ts: Date.now() };
  st.saved = true;
  history = [rec, ...history.filter((h) => !(h.date === rec.date && h.ts === rec.ts))];
  renderHistory(); persist();
  if (db) { try { const ref = await histCol().add(rec); rec._id = ref.id; persist(); $('#store').textContent = 'Сохранено в вашем аккаунте Claude.'; } catch { $('#store').textContent = 'Не удалось сохранить в аккаунт, запись осталась в этом браузере.'; } }
}

// ---------- события ----------
document.addEventListener('click', (e) => {
  const b = e.target.closest('.set'); if (!b) return;
  const k = b.dataset.k; st.done[k] = !st.done[k];
  if (!st.done[k]) st.saved = false;
  b.setAttribute('aria-pressed', String(!!st.done[k]));
  progress(); persist();
  if (st.done[k]) offerRest(k);
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'reps') { st.maxReps = e.target.value.replace(/\D/g, '').slice(0, 3); persist(); }
  if (e.target.id === 'kg') { st.weight = e.target.value.replace(/[^\d.,]/g, '').slice(0, 6); persist(); }
});
document.addEventListener('change', async (e) => {
  // если тренировка уже сохранена и меняют максимум — обновить запись
  if ((e.target.id === 'reps' || e.target.id === 'kg') && st.saved && history[0] && history[0].date === st.date) {
    history[0].maxReps = st.maxReps ? Number(st.maxReps) : null; history[0].weight = st.weight || null; renderHistory(); persist();
    if (db && history[0]._id) histCol().doc(history[0]._id).update({ maxReps: history[0].maxReps, weight: history[0].weight }).catch(() => {});
  }
});
let armed = false;
$('#new').addEventListener('click', async () => {
  const any = ALL.some((k) => st.done[k]);
  if (any && !armed) { armed = true; $('#new').textContent = 'Точно? Нажмите ещё раз'; setTimeout(() => { armed = false; $('#new').textContent = 'Новая тренировка'; }, 4000); return; }
  armed = false; $('#new').textContent = 'Новая тренировка';
  if (any && !st.saved) await saveToHistory();
  st = { date: today(), done: {}, maxReps: '', weight: '', saved: false };
  render(); persist(); window.scrollTo({ top: 0, behavior: 'smooth' });
});

// ---------- таймер отдыха ----------
// Отдых по плану владельца: разминка 2:00 между подходами и упражнениями; гантели 5:00 между кругами;
// жим 5:00 между подходами; между блоками 5:00. Время считается по часам, поэтому верно и при выключенном экране.
const BLOCK_NEXT = { w: 'Гантели', d: 'Штанга', b: null };
function restFor(k) {
  if (ALL.every((x) => st.done[x])) return null;
  const [blk, , n] = k.split('.');
  const left = ALL.filter((x) => x.startsWith(blk + '.') && !st.done[x]);
  if (!left.length) return BLOCK_NEXT[blk] ? [300, `Отдых перед блоком «${BLOCK_NEXT[blk]}»`] : null;
  if (blk === 'w') return [120, 'Отдых, разминка'];
  if (blk === 'd') {
    const roundDone = ALL.filter((x) => x.startsWith('d.') && x.endsWith('.' + n)).every((x) => st.done[x]);
    return roundDone ? [300, 'Отдых между кругами'] : null;
  }
  if (blk === 'b') return [300, 'Отдых, жим лёжа'];
  return null;
}
function offerRest(k) { const r = restFor(k); if (r) startTimer(r[0], r[1]); }

let tEnd = 0, tInt = null, actx = null;
function beep() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.35, 0.7].forEach((t0) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.0001, actx.currentTime + t0); g.gain.exponentialRampToValueAtTime(0.4, actx.currentTime + t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + t0 + 0.28);
      o.start(actx.currentTime + t0); o.stop(actx.currentTime + t0 + 0.3);
    });
  } catch { /* */ }
  try { navigator.vibrate && navigator.vibrate([400, 150, 400, 150, 400]); } catch { /* */ }
}
function stopTimer() {
  clearInterval(tInt); tInt = null; tEnd = 0;
  $('#t-box').hidden = true; $('#t-lbl').hidden = false; $('#tstop').hidden = true; $('#t2').hidden = false; $('#t5').hidden = false; document.querySelector('.timer').classList.remove('run');
}
function tick() {
  if (!tEnd) return;
  const left = Math.max(0, Math.ceil((tEnd - Date.now()) / 1000));
  $('#t-clock').textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
  if (!left) {
    clearInterval(tInt); tInt = null; tEnd = 0;
    $('#t-clock').textContent = 'Пора!'; $('#t-clock').classList.add('go'); $('#tstop').textContent = 'Ок'; beep();
  }
}
function startTimer(sec, why) {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume && actx.resume(); } catch { /* */ } // звук разрешается касанием
  tEnd = Date.now() + sec * 1000; clearInterval(tInt); tInt = setInterval(tick, 250);
  $('#t-why').textContent = why || 'Отдых';
  $('#t-lbl').hidden = true; $('#t-box').hidden = false; $('#t-clock').classList.remove('go');
  $('#t2').hidden = true; $('#t5').hidden = true; $('#tstop').hidden = false; $('#tstop').textContent = 'Пропустить'; document.querySelector('.timer').classList.add('run'); tick();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
$('#t2').addEventListener('click', () => startTimer(120, 'Отдых 2:00'));
$('#t5').addEventListener('click', () => startTimer(300, 'Отдых 5:00'));
$('#tstop').addEventListener('click', stopTimer);

// ---------- старт ----------
const local = lsGet();
if (local) { if (local.st) st = local.st; if (Array.isArray(local.history)) history = local.history; }
render(); renderHistory();

(async () => {
  const timeout = setTimeout(() => { if (!db) $('#store').textContent = 'Сохраняется только в этом браузере.'; }, 10000);
  try {
    const [d, u] = await Promise.all([window.claude?.use('db'), window.claude?.use('user')]);
    uid = u ? await u.id() : null;
    if (!d || !uid) { clearTimeout(timeout); $('#store').textContent = 'Сохраняется только в этом браузере.'; renderHistory(); return; }
    db = d;
    const [cur, hs] = await Promise.all([curDoc().get(), histCol().orderBy('ts', 'desc').limit(60).get()]);
    clearTimeout(timeout);
    const remote = hs.docs.map((x) => ({ ...x.data(), _id: x.id }));
    // записи, сделанные без связи, догружаем в аккаунт
    const known = new Set(remote.map((h) => h.ts));
    for (const h of history) if (!known.has(h.ts)) { try { const { _id, ...clean } = h; const ref = await histCol().add(clean); remote.push({ ...h, _id: ref.id }); } catch { /* */ } }
    history = remote.sort((a, b) => b.ts - a.ts);
    if (cur.exists && cur.data() && !(local && local.st && Object.keys(local.st.done || {}).length)) st = { ...st, ...cur.data() };
    $('#store').textContent = 'Сохраняется в вашем аккаунте Claude: видно только вам, на любом устройстве.';
    render(); renderHistory(); persist();
  } catch (e) {
    clearTimeout(timeout); $('#store').textContent = 'Сохраняется только в этом браузере.';
  }
})();
